services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims_dev_password
      POSTGRES_DB: claims
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  dbdata: